; Perfis de dispositivo do Detonauto (lote 15; docs/desempenho.md).

[DeviceProfiles]
+DeviceProfileNameAndTypes=DN_AlvoPS5,Windows

; "Alvo PS5": qualidade de console para medir sempre no mesmo nível, mesmo num PC mais forte que o alvo.
; Uso: -DeviceProfile=DN_AlvoPS5 na linha de comando do jogo, com janela de 1920x1080 (resolução interna 1080p, 100%).
; Grupos de escalabilidade (0 baixo, 1 médio, 2 alto, 3 épico): Lumen, sombras, reflexos e efeitos em "alto" (2), o nível que a
; Epic indica para 60 fps em console; distância de visão, texturas, anti-aliasing (TSR) e pós-processo em "épico" (3).
; Os valores deste perfil valem por cima das configurações de usuário (GameUserSettings), que têm prioridade menor.
[DN_AlvoPS5 DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=sg.ResolutionQuality=100
+CVars=sg.ViewDistanceQuality=3
+CVars=sg.AntiAliasingQuality=3
+CVars=sg.ShadowQuality=2
+CVars=sg.GlobalIlluminationQuality=2
+CVars=sg.ReflectionQuality=2
+CVars=sg.PostProcessQuality=3
+CVars=sg.TextureQuality=3
