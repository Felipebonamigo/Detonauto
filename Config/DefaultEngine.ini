; Configuração do Detonauto. Mapa inicial e GameMode entram quando houver conteúdo de jogo.

[/Script/EngineSettings.GameMapsSettings]

[/Script/Engine.RendererSettings]
; Base de renderização (lote 15; docs/plano-visual.md e docs/desempenho.md). Cada nome foi conferido no código da engine 5.8
; (Engine/Source/Runtime/Engine/Classes/Engine/RendererSettings.h e onde a variável é criada). Sem estas linhas valem os padrões
; do código, medidos no jogo em 14 out 2026: GI nenhuma (0), reflexo só de tela (2), sombras comuns (0) e sem campos de distância.

; Iluminação global dinâmica: 1 = Lumen (luz indireta de todas as luzes, do céu e de materiais emissivos).
r.DynamicGlobalIlluminationMethod=1
; Reflexos: 1 = Lumen (integrados à GI; refletem o céu, os prédios e a pintura dos outros carros).
r.ReflectionMethod=1
; Sombras: 1 = sombras virtuais (Virtual Shadow Maps), nítidas de perto e de longe com uma luz só.
r.Shadow.Virtual.Enable=1
; Campos de distância das malhas: o Lumen por software e a sombra do Sky Light dependem deles.
r.GenerateMeshDistanceFields=True
; Anti-aliasing: 4 = TSR (Temporal Super Resolution), que também reconstrói a imagem quando a resolução interna é menor.
r.AntiAliasingMethod=4
; Tudo dinâmico, sem luz pré-calculada: cidade destrutível e luz por mapa. Tira dos shaders as variações de lightmap.
r.AllowStaticLighting=False
; Pintura automotiva: o verniz (clear coat) com normal própria, para o relevo dos flocos não deformar o reflexo do verniz.
r.ClearCoatNormal=True
; Skin cache na GPU: os alvos de deformação (morph targets) do dano por zona dependem dele (plano visual, camada 1).
r.SkinCache.CompileShaders=True
; Exposição em EV100, a unidade física das câmeras: o pós-processo da cena de aparência usa exposição de câmera real.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Decisão: Lumen por software (campos de distância), sem ray tracing por hardware (r.RayTracing fica no padrão, desligado).
; O alvo é 60 fps no nível do PS5; ray tracing por hardware fica para avaliar com medição, se sobrar orçamento.

[SystemSettings]
; Exposição física de dia fica entre EV 13 e 15. O Lumen e a captura do céu em tempo real guardam a luz com um deslocamento fixo de
; exposição: o padrão (4) só cobre até EV 12, e a luz do dia era cortada (a engine avisava na tela). 8 cobre de EV -4 a 16, a faixa
; física inteira, segundo a descrição da própria variável na 5.8 (PostProcessEyeAdaptation.cpp).
r.EyeAdaptation.CachedLightingPreExposure=8

[/Script/Engine.CollisionProfile]
; Lote 17c: tipo de colisão do destroço de peça de rua (ECC_DNDebris em Source/Detonauto/Detonauto.h). Bloqueia por padrão, então
; chão, prédios, peças e tráfego continuam batendo nele; o carro e as rodas dele o ignoram (ADNBreakableProp::MakeDebris e ADNVehicle).
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="DNDebris")
